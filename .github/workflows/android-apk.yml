name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/logo-millenium.png'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # O runner ubuntu-latest já inclui Android SDK e sdkmanager.
      # Evita a etapa externa setup-android, que falhou antes da compilação.
      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
      - name: Instalar dependências
        run: npm install
      - name: Gerar site
        run: npm run build
      - name: Preparar projeto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Aplicar logo oficial ao ícone Android
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          source=Path('public/logo-millenium.png')
          if not source.exists():
              raise SystemExit('Logo oficial não encontrada: public/logo-millenium.png')
          original=Image.open(source).convert('RGBA')
          # Ícone quadrado com fundo branco para preservar a marca sem distorcer.
          def icon(size, inset=.12):
              canvas=Image.new('RGBA',(size,size),'white')
              edge=int(size*(1-2*inset))
              art=ImageOps.contain(original,(edge,edge),Image.Resampling.LANCZOS)
              canvas.alpha_composite(art,((size-art.width)//2,(size-art.height)//2))
              return canvas.convert('RGB')
          res=Path('android/app/src/main/res')
          for density,px in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder=res/('mipmap-'+density)
              folder.mkdir(parents=True,exist_ok=True)
              for name in ('ic_launcher.png','ic_launcher_round.png'):
                  icon(px).save(folder/name)
              # Camada da logo para ícones adaptativos.
              icon(px*3,.27).save(folder/'ic_launcher_foreground.png')
          # Substitui também os ícones adaptativos gerados pelo Capacitor.
          for folder in res.glob('mipmap-anydpi*'):
              for name in ('ic_launcher.xml','ic_launcher_round.xml'):
                  target=folder/name
                  if target.exists():
                      target.write_text('<?xml version="1.0" encoding="utf-8"?>' + chr(10) + '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@android:color/white"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>' + chr(10))
          print('Ícones Android gerados com',source)
          PY
      - name: Compilar APK de testes
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: otica-millennium-pdv-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
