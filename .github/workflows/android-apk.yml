name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # O runner ubuntu-latest já inclui Android SDK e sdkmanager.
      # Evita a etapa externa setup-android, que falhou antes da compilação.
      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
      - name: Instalar dependências
        run: npm install
      - name: Gerar site
        run: npm run build
      - name: Preparar projeto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Compilar APK de testes
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: otica-millennium-pdv-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
